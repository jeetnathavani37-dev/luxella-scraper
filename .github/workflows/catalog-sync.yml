name: Catalogue sync
on:
  schedule:
    - cron: '53 21 * * *'   # 03:23 IST  official stores (Coach, MK, Sephora, Macy's...)
    - cron: '43 22 * * *'   # 04:13 IST  GOAT drip + India sneaker prices
  workflow_dispatch:
    inputs:
      job:
        description: 'which job'
        type: choice
        options: [all, outlets, goat, blocked]
        default: 'all'
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  outlets:
    if: github.event_name == 'workflow_dispatch' && contains('all outlets', github.event.inputs.job) || github.event.schedule == '53 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing scraper still fails its step through `| tee`
    env:
      LX_CAT_KEY: ${{ secrets.LX_CAT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright && npx playwright install --with-deps chromium
      # Coach, Kate Spade, MK, Sephora, Macy's and Furla block GitHub IPs (403/empty since 28 Oct): they run only via job=blocked.
      # Partner copies of MK/Coach/Kate Spade go live while their outlet rows are stale (lx-catalog HIDE).
      - name: Official stores
        run: node scripts/outlet_scrape.js shopify,tb 2>&1 | tee -a sync.log
      - name: More stores (Shopify brands, Strathberry)
        run: node scripts/more_scrape.js shopify,strath 2>&1 | tee -a sync.log
        continue-on-error: true
      - name: Market (Ssense, Flannels, Rack, Ted Baker)
        run: node scripts/market_scrape.js 2>&1 | tee -a sync.log
        continue-on-error: true
      - name: Summary (warns on every store that saved 0)
        if: always()
        run: node scripts/sync_summary.js sync.log --expect=shopify,tb,strath,ssense,flannels,rack,tedbaker
  blocked:
    # Manual retry for stores that block GitHub IPs. No proxies or bot-check workarounds.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      LX_CAT_KEY: ${{ secrets.LX_CAT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright && npx playwright install --with-deps chromium
      - name: Coach, Kate Spade, MK
        run: node scripts/outlet_scrape.js coach,ks,mk 2>&1 | tee -a sync.log
        continue-on-error: true
      - name: Sephora, Macy's, Furla
        run: node scripts/more_scrape.js sephora,macys,furla 2>&1 | tee -a sync.log
        env: { MORE_SHOPIFY: '0' }   # the outlets job already refreshes the Shopify brands
        continue-on-error: true
      - name: Summary
        if: always()
        run: node scripts/sync_summary.js sync.log --expect=coach,ks,mk,sephora,macys,furla
  goat:
    if: github.event_name == 'workflow_dispatch' && contains('all goat', github.event.inputs.job) || github.event.schedule == '43 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LX_CAT_KEY: ${{ secrets.LX_CAT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright && npx playwright install --with-deps chromium
      - name: GOAT drip
        run: node scripts/goat_scrape.js
      - name: India sneaker prices
        run: python3 scripts/india_sneakers.py cdc,mainstreet,superkicks
        continue-on-error: true
