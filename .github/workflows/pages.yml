name: Deploy portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (set base path, 404 fallback)
        run: |
          set -e
          mkdir -p _site
          cp -r assets vendor app.js shim.js style.css _site/
          sed 's#<base href="/">#<base href="/luxella-scraper/">#' index.html > _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
