name: Deploy portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Build (set base path, 404 fallback)
        run: |
          set -e
          BASE="${{ steps.pages.outputs.base_path }}/"
          mkdir -p _site
          cp -r assets vendor app.js shim.js style.css _site/
          sed "s#<base href=\"/\">#<base href=\"$BASE\">#" index.html > _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
        id: deployment
