<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0906">
<title>Hey Luxella</title>
<link rel="icon" href="assets/favicon.svg">
<style>
:root{--g:#E9C98A;--g2:#C9A35E;--ink:#F3ECDD;--mut:#bfa978;--bg:#0b0906}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(120% 70% at 50% 0%,#1d160c,#0b0906 60%);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom));text-align:center}
.ey{font-size:10px;letter-spacing:.38em;color:var(--g2);font-weight:600}
h1{margin:10px 0 0;font:italic 400 30px Georgia,'Times New Roman',serif;color:#F1D58E}
.orb{margin:34px auto 22px;width:150px;height:150px;border-radius:50%;border:0;display:grid;place-items:center;color:#1a1208;background:radial-gradient(circle at 35% 30%,#fff3cf,#e9c98a 45%,#a8792a);box-shadow:0 0 0 14px rgba(233,201,138,.07),0 0 0 30px rgba(233,201,138,.035),0 24px 50px rgba(0,0,0,.6);cursor:pointer;-webkit-tap-highlight-color:transparent}
.orb.on{animation:p 1.3s ease-in-out infinite}.orb.busy{opacity:.7;animation:none}
@keyframes p{50%{box-shadow:0 0 0 24px rgba(233,201,138,.16),0 0 0 48px rgba(233,201,138,.05),0 24px 50px rgba(0,0,0,.6)}}
.st{font:italic 400 19px Georgia,serif;color:#EADBB8;min-height:26px}
.q{margin:10px 0 0;color:var(--g);font-size:15px;min-height:20px}
.a{margin:22px auto 0;max-width:480px;padding:18px;border-radius:16px;border:1px solid rgba(233,201,138,.35);background:rgba(255,255,255,.035);font-size:16px;line-height:1.55;text-align:left;display:none}
.a.show{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.b{border:1px solid rgba(233,201,138,.45);background:rgba(255,255,255,.04);color:#EADBB8;border-radius:999px;padding:10px 14px;font-size:13px;text-decoration:none;cursor:pointer}
.b.gold{border:0;background:linear-gradient(100deg,#b8892b,#f7e2a6 50%,#b8892b);color:#1a1208;font-weight:600}
form{display:flex;gap:8px;width:100%;max-width:480px;margin-top:22px}
input{flex:1;min-width:0;border-radius:999px;border:1px solid rgba(233,201,138,.4);background:rgba(255,255,255,.05);color:var(--ink);padding:13px 16px;font-size:15px;outline:0}
.err{color:#e8a27a}
</style>
</head>
<body>
<main>
 <div class="ey">HEY LUXELLA</div>
 <h1 id="hi">Ask about your orders</h1>
 <button class="orb" id="orb" type="button" aria-label="Tap and speak"><svg viewBox="0 0 24 24" width="46" height="46"><rect x="9" y="3" width="6" height="11.5" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
 <div class="st" id="st">Tap the mic and ask</div>
 <div class="q" id="q"></div>
 <div class="a" id="a"></div>
 <div class="row" id="act"></div>
 <form id="f"><input id="in" placeholder="…or type: where is my Coach bag?" enterkeyhint="send"><button class="b gold" type="submit">Ask</button></form>
 <div class="row" id="sug"></div>
</main>
<script>
(function(){
 var API='https://qzripzgbstvxkfobzhyv.supabase.co/functions/v1/lx-voice';
 var u=new URL(location.href),t=u.searchParams.get('t')||'';
 try{if(t)localStorage.setItem('lx_vt',t);else t=localStorage.getItem('lx_vt')||'';}catch(e){}
 var $=function(i){return document.getElementById(i);};
 var orb=$('orb'),st=$('st'),qv=$('q'),av=$('a'),act=$('act');
 if(!/^[a-f0-9]{24,64}$/.test(t)){st.innerHTML='<span class="err">This voice link is not set up.</span>';av.textContent='Open your Luxella page, tap the gold mic, then “Use with Bixby / Google” and copy the command again.';av.classList.add('show');orb.disabled=true;return;}
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
 function speak(x){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var m=new SpeechSynthesisUtterance(String(x).replace(/₹/g,'rupees '));m.lang='en-IN';m.rate=1;speechSynthesis.speak(m);}catch(e){}}
 function ask(q){q=String(q||'').trim();if(!q)return;qv.textContent='“'+q+'”';st.textContent='One moment…';orb.classList.add('busy');act.textContent='';
  fetch(API+'?fmt=json&t='+encodeURIComponent(t)+'&q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){orb.classList.remove('busy');st.textContent='Ask another?';av.textContent=d.text||'';av.classList.add('show');speak(d.text||'');
   if(d.url){var a=document.createElement('a');a.className='b gold';a.href=d.url;a.textContent='Open it on my Luxella page';act.appendChild(a);}
  }).catch(function(){orb.classList.remove('busy');st.innerHTML='<span class="err">No connection. Try again.</span>';});}
 function listen(){if(!SR){st.textContent='Type your question below';$('in').focus();return;}
  if(rec){try{rec.stop();}catch(e){}return;}
  try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  rec=new SR();rec.lang='en-IN';rec.interimResults=true;var fin='';
  rec.onstart=function(){orb.classList.add('on');st.textContent='Listening…';};
  rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;qv.textContent='“'+s+'”';if(e.results[e.results.length-1].isFinal)fin=s;};
  rec.onerror=function(e){orb.classList.remove('on');st.textContent=e&&e.error==='not-allowed'?'Allow the microphone, then tap again':'Tap the mic and try again';};
  rec.onend=function(){orb.classList.remove('on');rec=null;if(fin.trim())ask(fin);};
  try{rec.start();}catch(e){rec=null;}}
 orb.onclick=listen;
 $('f').onsubmit=function(e){e.preventDefault();ask($('in').value);$('in').value='';};
 ['Where are my orders?','Show my proof of purchase','What do I owe?','When is my next delivery?'].forEach(function(s){var b=document.createElement('button');b.type='button';b.className='b';b.textContent=s;b.onclick=function(){ask(s);};$('sug').appendChild(b);});
 var q0=u.searchParams.get('q');if(q0)ask(q0);else if(SR)setTimeout(listen,350);
})();
</script>
</body>
</html>
